[package]
name = "grafhome-ca"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
build = "build.rs"

# Keep ordinary local Cargo commands aligned with CI's warnings-as-errors
# policy. This catches warning regressions before they depend on Clippy's
# command-line flags or a particular workflow entry point.
[lints.rust]
warnings = "deny"

[[bin]]
name = "grafhome-ca"
path = "src/bin/grafhome-ca.rs"

[dependencies]
base64 = "0.23.0"
clap = { version = "4.5.50", features = ["derive"] }
fs2 = "0.4.3"
# Default features add remote ($ref over HTTP) and filesystem schema
# resolution, which drag in reqwest, rustls, and the C/assembly aws-lc-sys.
# That breaks the pure-Rust dependency graph the static musl release build
# relies on, and no schema this crate compiles needs a resolver: every schema
# is embedded with include_str! and only uses in-document "#/..." refs. The
# published entry-point schemas under schemas/policy/ do carry cross-file
# refs, but they exist for external consumers and are never compiled here.
jsonschema = { version = "0.50.0", default-features = false }
rpassword = "7.4.0"
rustix = { version = "1.1.2", features = ["fs", "process", "system", "termios"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = { version = "0.11.0", default-features = false }
ssh-key = { version = "0.6.7", default-features = false, features = ["ecdsa", "std"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
toml = "1.1.3"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
rustix-openpty = "0.2.0"
