[package]
name = "grafhome-ca"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
build = "build.rs"

[[bin]]
name = "grafhome-ca"
path = "src/bin/grafhome-ca.rs"

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
csv = "1.3.1"
jsonschema = "0.18.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"
