# shellcheck shell=bash
# shellcheck disable=SC2034  # consumed by release-lib.sh after sourcing
#
# Per-project inputs to the shared release scripts vendored from
# cgraf78/actions. Everything else about the release flow lives in
# scripts/release-lib.sh and must not be forked here.

RELEASE_ENV_PREFIX=GRAFHOME_CA
RELEASE_SLUG=grafhome-ca
RELEASE_ASSET_NAME=grafhome-ca
RELEASE_BINARY=grafhome-ca
# This project ships a bin/ layout rather than the binary at the archive root.
RELEASE_BINARY_DEST=bin/grafhome-ca

# Ask the shared cgraf78/actions renderer to publish a self-contained top-level
# installer. The generated file contains no site policy and has no runtime
# dependency on the Actions checkout.
RELEASE_STANDALONE_INSTALLER=true

RELEASE_PAYLOAD_FILES=(
  README.md
  LICENSE
)

# Non-secret runtime assets. These are optional by contract: `completions` and
# `man` are not generated today, and a release must not fail on a tree this
# project has not started shipping yet.
RELEASE_PAYLOAD_DIRS=(
  completions
  examples
  schemas
  templates
  docs
  man
)
