ssh_roles = ["server", "client"]
principals = ["edge-host", "edge-host.example.test"]

[user_access.alice]
enrollment = true

[[user_access.alice.logins]]
unix_account = "alice"

[[user_access.console.logins]]
unix_account = "alice"
source_addresses = ["192.0.2.20"]
restrict_session = true

[x509_certs.nfs-client]
role = "client"
names = ["edge-host.example.test"]
ttl = "24h"
ca_endpoint = "ca_origin"
