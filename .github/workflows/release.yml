name: Release

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9]-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]"

permissions:
  contents: read

jobs:
  release:
    uses: cgraf78/actions/.github/workflows/rust-release.yml@9b9c023fbe5f47be5f70f5a82bd8e2f298f6a1b1
    permissions:
      contents: write
    with:
      # CI's x86_64 Android build exists only for the emulator runtime. This
      # project's supported physical-device release target is AArch64, so
      # publishing an emulator-only archive would be misleading.
      android-aarch64: true
      tag-command: scripts/release-tag.sh
      # The shared matrix installs each Rust target. grafhome-ca has no native
      # dependency, so Rust's bundled musl support is sufficient and releases
      # avoid an unnecessary host package/network dependency.
      package-command: scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
      smoke-command: scripts/smoke-release.sh "$ASSET_PLATFORM"
