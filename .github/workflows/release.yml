name: Release

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9]-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]"

permissions:
  contents: read

jobs:
  release:
    uses: cgraf78/actions/.github/workflows/rust-release.yml@a2dd8390ddd0b410d5a82822296036387247cc4c
    permissions:
      contents: write
    with:
      android-aarch64: true
      tag-command: scripts/release-tag.sh
      # Static Linux release binaries link C code, so musl targets need a musl
      # linker. The shared workflow owns the matrix and its prerequisites.
      install-musl-tools: true
      package-command: scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
      smoke-command: scripts/smoke-release.sh "$ASSET_PLATFORM"
