name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Stagger sibling repositories so scheduled full matrices and the advisory
    # audit do not compete for the same runner capacity at the top of the hour.
    - cron: "7 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  STEP_CLI_PACKAGE_VERSION: 0.30.6-1
  STEP_CA_PACKAGE_VERSION: 0.30.2-1
  STEP_CLI_VERSION: 0.30.6
  STEP_CA_VERSION: 0.30.2

jobs:
  rust:
    uses: cgraf78/actions/.github/workflows/rust-ci.yml@3834fe036de0360a8418b6e129034797071edb0c
    with:
      # Cargo.toml makes Rust 1.88 part of the public compatibility contract.
      # Running that check inside shared Rust CI keeps it under rust / Required
      # and gives it the same locked, all-target, all-feature policy as peers.
      msrv-toolchain: "1.88"
      # cargo-audit scans optional packages recorded in Cargo.lock even when no
      # build can reach them. ssh-key declares RSA as optional, while this repo
      # enables only ECDSA plus std; RUSTSEC-2023-0071 also has no fixed release.
      # The setup guard below proves that RSA stays unreachable on every PR and
      # push before this scheduled advisory exception is allowed to apply.
      audit-command: cargo audit --file Cargo.lock --ignore RUSTSEC-2023-0071
      setup-command: |
        as_root() {
          if [ "$(id -u)" -eq 0 ]; then
            "$@"
          else
            sudo "$@"
          fi
        }
        case "$MATRIX_NAME" in
          Arch)
            as_root pacman -S --noconfirm openssh
            ;;
          "CentOS Stream" | Fedora)
            as_root dnf install -y openssh-clients
            ;;
          Alpine)
            as_root apk add --no-cache openssh-client-default
            ;;
          Debian | Ubuntu | WSL)
            as_root apt-get update
            as_root apt-get install -y --no-install-recommends openssh-client
            ;;
        esac

        # RustSec now runs on every Rust CI event, but its narrow ignore cannot
        # prove the premise that makes that exception safe. Enforce that premise
        # independently: if any target or root feature makes RSA reachable, fail
        # before tests even though cargo-audit was told to ignore the advisory.
        rsa_paths=$(cargo tree --locked --all-features --target all -i rsa)
        if [[ -n "$rsa_paths" ]]; then
          printf '%s\n' 'RSA is active; remove the RustSec exception and address RUSTSEC-2023-0071' >&2
          printf '%s\n' "$rsa_paths" >&2
          exit 1
        fi
      # This project's supported physical-device release target is AArch64.
      # The x86_64 build below is not another release artifact; it exists only
      # to execute the binary in CI's x86_64 Android emulator.
      android-package-smoke-command: |
        scripts/package-release.sh "$RUST_TARGET" "$ASSET_PLATFORM"
        scripts/smoke-release.sh "$ASSET_PLATFORM"
      termux-command: scripts/termux-ci.sh
      termux-host-command: |
        target_dir="$RUNNER_TEMP/grafhome-ca-termux-target"
        cargo build --release --locked --target "$RUST_TARGET" --target-dir "$target_dir"
        mkdir -p .termux-ci
        install -m 0755 \
          "$target_dir/$RUST_TARGET/release/grafhome-ca" \
          .termux-ci/grafhome-ca
      # Tagged releases publish a static Linux archive, so regular CI builds and
      # smokes that same artifact shape. The dependency graph is pure Rust: the
      # shared default adds the target without an unnecessary apt/linker step.
      package-smoke-musl-target: x86_64-unknown-linux-musl
      package-smoke-command: |
        archive=$(scripts/package-release.sh "$RUST_TARGET" linux-x86_64-musl)
        scripts/smoke-release.sh linux-x86_64-musl
        install_root=$(mktemp -d)
        trap 'rm -rf "$install_root"' EXIT
        mkdir -p "$install_root/home"
        HOME="$install_root/home" ./install.sh --archive "$archive" \
          --data-home "$install_root/data" --bin-dir "$install_root/bin" \
          --man-dir "$install_root/man"
        "$install_root/bin/grafhome-ca" version
        test -f "$install_root/data/cgraf78/grafhome-ca/schemas/policy/revocations.schema.json"

  shell:
    uses: cgraf78/actions/.github/workflows/shell-ci.yml@3834fe036de0360a8418b6e129034797071edb0c
    with:
      matrix-set: full
      profiles: base
      shellcheck-inventory-path: .github/shellcheck-files.txt
      test-command: |
        set -euo pipefail
        tests/shell/install-test
        tests/shell/release-scripts-test

  actions-sync:
    name: cgraf78/actions sync
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub resolves literal `uses:` refs before a job can read repository
      # files, so `.github/cgraf78-actions.lock` cannot be interpolated. This
      # gate verifies every unavoidable action literal and all vendored release
      # scripts still match that single reviewed dependency decision.
      - uses: cgraf78/actions/.github/actions/verify-consumer-sync@3834fe036de0360a8418b6e129034797071edb0c

  # These jobs exercise grafhome-ca product behavior against real OpenSSH and
  # Smallstep packages. They remain caller-owned because putting product
  # services, environment flags, or privileged integration policy into the
  # reusable Rust workflow would couple unrelated consumers to this repo.
  ssh-revocation:
    name: SSH Revocation / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install OpenSSH server
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server openssh-client

      # The whole binary runs rather than a name filter: a filter that matches
      # nothing still exits 0, which would leave this job green while testing
      # nothing. Every other test here is unaffected by the flags below.
      - name: Run sshd revocation test
        env:
          GRAFHOME_CA_RUN_SSH_REVOCATION: "1"
          GRAFHOME_CA_REQUIRE_SSH_REVOCATION: "1"
        run: cargo test --locked --test cli

  step-ca-integration:
    name: Step CA Integration / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Smallstep packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packages.smallstep.com/keys/apt/repo-signing-key.gpg | sudo tee /etc/apt/keyrings/smallstep.asc >/dev/null
          sudo tee /etc/apt/sources.list.d/smallstep.sources >/dev/null <<'EOF'
          Types: deb
          URIs: https://packages.smallstep.com/stable/debian
          Suites: debs
          Components: main
          Signed-By: /etc/apt/keyrings/smallstep.asc
          EOF
          sudo apt-get update
          sudo apt-get install -y "step-cli=${STEP_CLI_PACKAGE_VERSION}" "step-ca=${STEP_CA_PACKAGE_VERSION}"
          step version | grep -F "Smallstep CLI/${STEP_CLI_VERSION}"
          step-ca version | grep -F "Smallstep CA/${STEP_CA_VERSION}"

      - name: Run step-ca integration test
        env:
          GRAFHOME_CA_RUN_STEP_CA_INTEGRATION: "1"
          GRAFHOME_CA_REQUIRE_STEP_CA_INTEGRATION: "1"
        run: cargo test --locked --test step_ca_integration
